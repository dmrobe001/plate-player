<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plate Player</title>
  <!-- @inline styles.css -->
</head>
<body>
  <canvas id="gpuCanvas"></canvas>

  <aside class="panel">
    <details open>
      <summary>
        <span class="title">Plate Player</span>
        <span class="subtitle">particle plate tectonics</span>
      </summary>

      <div class="controls">
        <label class="row">Seed
          <input id="seed" type="number" min="0" step="1" value="1">
          <button id="regenerate" type="button">Regenerate</button>
        </label>
        <label class="row"><input id="pause" type="checkbox"> Pause</label>
        <label class="row"><input id="spin" type="checkbox"> Auto-spin globe</label>
        <label class="row"><input id="showMantle" type="checkbox" checked> Show mantle</label>
        <label class="row"><input id="showNormal" type="checkbox" checked> Normal stress lines</label>
        <label class="row"><input id="showShear" type="checkbox" checked> Shear stress ticks</label>
        <label class="row" title="Stress at which a line is one apothem wide">Line scale
          <input id="stressRef" type="range" min="0" max="3" step="0.05" value="2.18">
          <output id="stressRefOut"></output>
        </label>
      </div>

      <div class="legend">
        <div class="colorbar"></div>
        <div class="colorbar-labels"><span>&minus;6 km</span><span>sea level</span><span>+4.5 km</span></div>
        <div class="key"><span class="swatch compression"></span>compression
          <span class="swatch tension"></span>tension
          <span class="swatch shear"></span>shear</div>
      </div>

      <fieldset class="record">
        <legend>Recording</legend>
        <label class="row"><input id="recordOn" type="checkbox" checked> Record this run</label>
        <label class="row">Fields every <input id="fieldInterval" type="number" min="0" step="0.5" value="1"> Myr</label>
        <label class="row">Snapshot every <input id="snapshotInterval" type="number" min="0" step="5" value="25"> Myr</label>
        <div class="row buttons">
          <button id="snapshotNow" type="button">Snapshot now</button>
          <button id="downloadRecord" type="button">Download record</button>
        </div>
        <label class="row file">Resume from record
          <input id="loadRecord" type="file" accept=".zip,application/zip">
        </label>
      </fieldset>

      <dl id="stats" class="stats"></dl>
      <div id="errors" class="errors"></div>
    </details>
  </aside>

  <!-- @inline main.js -->
</body>
</html>
