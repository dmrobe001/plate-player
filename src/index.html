<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plate Player</title>
  <!-- @inline styles.css -->
</head>
<body>
  <canvas id="gpuCanvas"></canvas>

  <aside class="panel">
    <details open>
      <summary>
        <span class="title">Plate Player</span>
        <span class="subtitle">particle plate tectonics</span>
      </summary>

      <div class="controls">
        <label class="row">World
          <select id="world">
            <option value="two-plate" selected>Two plates (162 columns)</option>
            <option value="random">Random planet (~10k columns)</option>
          </select>
        </label>
        <label class="row">Seed
          <input id="seed" type="number" min="0" step="1" value="1">
          <button id="regenerate" type="button">Regenerate</button>
        </label>
        <label class="row"><input id="pause" type="checkbox"> Pause</label>
        <label class="row"><input id="spin" type="checkbox"> Auto-spin globe</label>
        <label class="row"><input id="showMantle" type="checkbox" checked> Show mantle</label>
        <label class="row"><input id="colorByPlate" type="checkbox"> Colour by plate</label>
        <label class="row" title="Sum of all forces on each column: its edges, basal drag and the GPE push. The model has no inertia, so this is zero in a converged solve: what is left is the solver's residual. Drawn as a traction: force / (depth x column width)"><input id="showForce" type="checkbox"> Net force arrows (residual)</label>
        <label class="row" title="Mantle flow beneath each column (cyan) and the column's own velocity (magenta); one apothem = 5 cm/yr"><input id="showVelocity" type="checkbox" checked> Mantle / column velocity</label>
        <label class="row" title="Principal axes of each column's stress tensor: arrows out = tension, in = compression"><input id="showStress" type="checkbox" checked> Principal stress arrows</label>
        <label class="row" title="Stress at which an arrow is one apothem long">Arrow scale
          <input id="stressRef" type="range" min="0" max="3" step="0.05" value="2.18">
          <output id="stressRefOut"></output>
        </label>
      </div>

      <div class="legend">
        <div class="colorbar"></div>
        <div class="colorbar-labels"><span>&minus;6 km</span><span>sea level</span><span>+4.5 km</span></div>
        <div class="key"><span class="item"><span class="swatch compression"></span>&rarr;&larr; compression</span>
          <span class="item"><span class="swatch tension"></span>&larr;&rarr; tension</span>
          <span class="item"><span class="swatch force"></span>net force</span>
          <span class="item"><span class="swatch mantle"></span>mantle</span>
          <span class="item"><span class="swatch column"></span>column</span>
          <span class="item"><span class="swatch slab"></span>slab</span></div>
      </div>

      <fieldset class="record">
        <legend>Recording</legend>
        <label class="row"><input id="recordOn" type="checkbox" checked> Record this run</label>
        <label class="row">Fields every <input id="fieldInterval" type="number" min="0" step="0.5" value="1"> Myr</label>
        <label class="row">Snapshot every <input id="snapshotInterval" type="number" min="0" step="5" value="25"> Myr</label>
        <div class="row buttons">
          <button id="snapshotNow" type="button">Snapshot now</button>
          <button id="downloadRecord" type="button">Download record</button>
        </div>
        <label class="row file">Resume from record
          <input id="loadRecord" type="file" accept=".zip,application/zip">
        </label>
      </fieldset>

      <dl id="stats" class="stats"></dl>
      <div id="errors" class="errors"></div>
    </details>
  </aside>

  <!-- @inline main.js -->
</body>
</html>
